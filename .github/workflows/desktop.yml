name: Windows desktop package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - run: python -m pip install ".[desktop-build]"
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_public_tree.py
      - run: python tools/build_desktop.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Proxy-Setup-Assistant-windows-x64
          path: |
            dist/Proxy-Setup-Assistant-*-windows-x64.zip
            dist/Proxy-Setup-Assistant-*-windows-x64.zip.sha256
            dist/Proxy-Setup-Assistant.bat
            dist/Proxy-Setup-Assistant.bat.sha256
          if-no-files-found: error
          retention-days: 30
