[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vps-proxy-setup"
version = "0.1.0"
description = "Guided SSH setup and a private HTTPS Hysteria 2 / Trojan import page"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "thomasthzh"}]
dependencies = []

[project.scripts]
vps-proxy-setup = "vps_proxy_setup.cli:main"

[tool.setuptools.packages.find]
include = ["vps_proxy_setup*"]

[tool.setuptools.package-data]
"vps_proxy_setup.server" = ["*.json"]
